#Nom du projet, décrit ce que fait le workflow
name: Compilation et tests du projet Maven

#S'exécute à chaque push et chaque Pull Request vers main, ou manuellement
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
          - name: Récupérer le code
            uses: actions/checkout@v5
          - name: Installer le JDK 25
            uses: actions/setup-java@v5
            with:
              distribution: 'temurin'
              java-version: '25'
              cache: maven
          - name: Donner accès en exécution au wrapper
            run: chmod +x mvnw
          - name: Compilation du projet Maven
            run: ./mvnw -B compile
          - name: Build and analyze
            env:
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            run: ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=taAnhQuoc_atelier_refactoring -Dsonar.organization=taanhquoc
